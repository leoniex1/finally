[project]
name = "finally-backend"
version = "0.1.0"
description = "FinAlly backend — FastAPI trading workstation server"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "litellm>=1.55",
]

# `dependency-groups` rather than the legacy `tool.uv.dev-dependencies`,
# which uv deprecates (the warning called out in MARKET_DATA_REVIEW.md's
# test-results section).
[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
