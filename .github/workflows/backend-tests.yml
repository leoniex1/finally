name: Backend Tests

# "Tests exist and pass locally" and "tests run in CI" are different
# guarantees — this workflow closes that gap, noted in
# planning/MARKET_DATA_REVIEW.md Finding #4.

on:
  push:
    branches: [main, start]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -v
